name: Prepare draft GitHub release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain build
      - name: Create draft beta release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          # Release notes are this version's section of CHANGELOG.md.
          awk -v heading="## ${VERSION}" '$0 == heading {found = 1; next} /^## / {found = 0} found' \
            CHANGELOG.md > release-notes.md
          gh release create "v${VERSION}" build/libs/*.jar \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Find Me Clientside ${VERSION} - Forge 1.20.1" \
            --notes-file release-notes.md
