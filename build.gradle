buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' }
}

plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
apply plugin: 'org.spongepowered.mixin'

group = 'dev.findmeclientside'
version = "${minecraft_version}-${mod_version}"
base.archivesName = 'findmeclientside-forge'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { findmeclientside { source sourceSets.main } }
        }
        client {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }
    }
}

repositories {
    maven { url = 'https://repo.sleeping.town/' }
    maven {
        url = 'https://modmaven.dev/'
        content { includeGroup 'appeng' }
    }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf("dev.emi:emi-forge:${emi_version}:api")
    // Optional AE2 terminal integration; never bundled.
    compileOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    if (!project.hasProperty('withoutEmi')) {
        runtimeOnly fg.deobf("dev.emi:emi-forge:${emi_version}")
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

mixin {
    add sourceSets.main, 'findmeclientside.refmap.json'
    config 'findmeclientside.mixins.json'
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}

tasks.named('jar', Jar) {
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
    from('LICENSES') { into 'LICENSES' }
    manifest.attributes('MixinConfigs': 'findmeclientside.mixins.json',
            'Implementation-Version': project.version)
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test) { useJUnitPlatform() }
