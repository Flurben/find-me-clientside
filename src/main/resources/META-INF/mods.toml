[[mods]]
modId="findmeclientside"
version="${version}"
displayName="Find Me Clientside"
authors="Flurben; inspired by Buuz135's FindMe"
displayTest="IGNORE_ALL_VERSION"
displayURL="https://github.com/Flurben/find-me-clientside"
logoFile="icon.png"
description='''
Locate items in containers you have opened, using only information sent to your client.
Press Y over an inventory or EMI item to highlight remembered containers.
Works on servers without the mod. EMI is optional.
'''

[[dependencies.findmeclientside]]
modId="forge"
mandatory=true
versionRange="[47.1,48)"
ordering="NONE"
side="CLIENT"

[[dependencies.findmeclientside]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1]"
ordering="NONE"
side="CLIENT"

[[dependencies.findmeclientside]]
modId="emi"
mandatory=false
versionRange="[1.1.0,)"
ordering="AFTER"
side="CLIENT"
