[[mods]]
modId="findmeclientside"
version="${version}"
displayName="Find Me Clientside"
authors="Flurben; inspired by Buuz135's FindMe"
displayTest="IGNORE_ALL_VERSION"
displayURL="https://github.com/Flurben/find-me-clientside"
logoFile="icon.png"
description='''
Locate items, fluids and placed blocks using only information sent to your client.
Press Y over an inventory, EMI or AE2 entry to highlight containers, tanks and ME networks,
or Shift+Y to highlight where it is placed.
Works on servers without the mod. EMI and AE2 are optional.
'''

[[dependencies.findmeclientside]]
modId="forge"
mandatory=true
versionRange="[47.1,48)"
ordering="NONE"
side="CLIENT"

[[dependencies.findmeclientside]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1]"
ordering="NONE"
side="CLIENT"

[[dependencies.findmeclientside]]
modId="emi"
mandatory=false
versionRange="[1.1.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.findmeclientside]]
modId="ae2"
mandatory=false
versionRange="[15.0.0,)"
ordering="NONE"
side="CLIENT"
